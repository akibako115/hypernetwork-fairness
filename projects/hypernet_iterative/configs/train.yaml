# @package _global_
defaults:
  - callbacks: default
  - logger: wandb
  - paths: default
  - trainer: gpu
  - experiment: spatial_lora_chexpert
  - _self_

project: hypernet_iterative
task_name: train
seed: 12345
run_dir: null
dry_run: false

# workflow.py がこの計画を使い、warmup と各 cohort stage を独立 process で実行する。
iteration:
  warmup_epochs: 2
  stages: 14
  stage_epochs: 2
  clusters: 10
  n_init: 50
  cohort_training_strategy: group_dro
  cohort_checkpoint_selection: global_auroc_bacc

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
