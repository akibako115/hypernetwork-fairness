# @package _global_
defaults:
  - callbacks: default
  - logger: wandb
  - paths: default
  - trainer: gpu
  # 既定の experiment は置かない。置くと、experiment を渡し忘れた起動が「たまたま既定だった
  # 条件」で完走してしまう。未指定は Hydra が MissingMandatoryValue で止める。
  - experiment: ???
  - _self_

project: hypernet_iterative
# この run を**何のために回したか**。値は `analysis/<study>/` の directory 名で、解決済み設定ごと
# W&B へ載るので dashboard では `config.study` で絞れる。既定は置かない。起動時にしか残せない
# 記録なので、後から思い出す羽目にならないよう必ず指定する（探りの run は `study=scratch`）。
#
# どの分析がこの run を**引用したか**は別の関係で、1 run が複数の study に出る。そちらの正本は
# `analysis/<study>/runs.md` が持つ。ここが決めるのは生成の理由だけとする。
study: ???
task_name: train
# tags は人が付ける印にだけ使う。dataset・model・目的関数のような、解決済み設定と run 名から
# 読める条件を写さない（CLI override で古くなり、W&B 上で嘘になる）。必要なときに
# `tags=[...]` で渡す。
tags: []
seed: 12345
run_dir: null
dry_run: false

# workflow.py がこの計画を使い、warmup と各 cohort stage を独立 process で実行する。
iteration:
  warmup_epochs: 2
  stages: 14
  stage_epochs: 2
  clusters: 10
  n_init: 50
  cohort_training_strategy: group_dro
  # group loss の大きさと 1 epoch あたりの step 数で決まる。class weight を変えると group
  # loss の大きさも変わるため、weighting と独立には選べない。
  group_dro_step_size: 0.01
  cohort_checkpoint_selection: global_auroc_bacc

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
