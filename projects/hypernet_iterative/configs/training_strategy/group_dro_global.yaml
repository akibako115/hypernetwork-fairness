# @package _global_
training_strategy:
  name: group_dro_global
  uses_cohort_group_id: true
  supports_warm_start: true
  class_weight_scope: global
model:
  loss_fn:
    _target_: projects.hypernet_iterative.loss.GlobalClassWeightedGroupDROTaskLoss
    num_groups: ${cohort.num_groups}
    class_weight: null
    step_size: ${iteration.group_dro_step_size}
    group_key: ${cohort.group_key}
