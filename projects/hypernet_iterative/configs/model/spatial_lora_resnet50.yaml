_target_: projects.hypernet_iterative.module.LitModule
optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1e-4
  weight_decay: 1e-2
scheduler: null
net:
  _target_: projects.hypernet_iterative.models.spatial_hypernet.network.SpatialLoRAResNet
  num_classes: ${data.num_classes}
  rank: 4
  lora_alpha: 1.0
  modulation_stages: [stage3, stage4, fc]
  classifier_rank: 4
  classifier_lora_alpha: 1.0
  backbone:
    _target_: projects.hypernet_iterative.models.resnet.network.ResNetBackbone
    layers: [3, 4, 6, 3]
    block: Bottleneck
  metadata_encoder:
    _target_: projects.hypernet_iterative.models.spatial_hypernet.metadata_encoder.MetadataEncoder
    categorical_cardinalities: ${data.attribute_spec.categorical_cardinalities}
    num_continuous: ${data.attribute_spec.continuous_dim}
    embedding_dim: 4
    hidden_dim: 128
    output_dim: 16
loss_fn:
  _target_: projects.hypernet_iterative.loss.TaskLoss
  class_weight: null
use_attributes: true
# CheXpert の実験系列は ResNet-50 の ImageNet 重みから始める。旧 repo の iterative と
# 同じ初期化であり、これを外すと 30 epoch の予算と warmup 2 epoch の cohort 品質が変わる。
backbone_checkpoint_path: ${paths.checkpoints_dir}/resnet50_imagenet.pth
warm_start_checkpoint_path: null
freeze_backbone: false
attribute_names: ${data.attribute_names}
fairness_attribute_names: ${data.fairness_attribute_names}
compile: false
