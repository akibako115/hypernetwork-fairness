_target_: projects.hypernet_two_stage.module.LitModule

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1e-4
  weight_decay: 1e-2
scheduler: null

net:
  _target_: projects.hypernet_two_stage.models.resnet.network.ResNet
  layers: [3, 4, 6, 3]
  block: Bottleneck
  num_classes: ${data.num_classes}
  zero_init_residual: false
  groups: 1
  width_per_group: 64
  replace_stride_with_dilation: null

loss_fn:
  _target_: projects.hypernet_two_stage.loss.TaskLoss
  class_weight: null

use_attributes: false
backbone_checkpoint_path: null
freeze_backbone: false
attribute_names: ${data.attribute_names}
fairness_attribute_names: ${data.fairness_attribute_names}
compile: false
