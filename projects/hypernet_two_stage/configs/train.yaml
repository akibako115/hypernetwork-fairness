# @package _global_
defaults:
  - callbacks: default
  - logger: wandb
  - paths: default
  - trainer: gpu
  - stage1: resnet50
  - stage2: spatial_lora_resnet50
  - experiment: chexpert_inverse_weighted_loss
  - override hydra/hydra_logging: colorlog
  - override hydra/job_logging: console
  - _self_

project: hypernet_two_stage
task_name: train
seed: 12345
tags: []

# weighting=inverse のとき workflow が train split の class 頻度から解決する。両 stage の
# loss_fn がこの値を参照するので、解決先は1箇所に保つ。
class_weight: null

# run.py が一意な run directory を予約してから設定する。config 単体では出力しない。
run_dir: null

# Hydra 固有の outputs/ は使わず、run.py が予約する project 内 runs/ だけへ保存する。
hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
