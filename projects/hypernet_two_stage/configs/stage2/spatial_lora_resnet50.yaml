# Stage 2: Stage 1 の best checkpoint を共有重みとして読み、backbone と classifier を凍結した上で
# metadata 条件付き Spatial LoRA だけを学習する。CLI からは `stage2.model.net.rank=8` のように
# stage を明示して上書きする。`backbone_checkpoint_path` は実行時にしか決まらないので
# workflow が Stage 1 の結果から注入する。
model:
  _target_: projects.hypernet_two_stage.module.LitModule

  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 1e-4
    weight_decay: 1e-2
  scheduler: null

  net:
    _target_: projects.hypernet_two_stage.models.spatial_hypernet.network.SpatialLoRAResNet
    num_classes: ${data.num_classes}
    rank: 4
    lora_alpha: 1.0
    modulation_stages: [stage3, stage4, fc]
    classifier_rank: 4
    classifier_lora_alpha: 1.0
    backbone:
      _target_: projects.hypernet_two_stage.models.resnet.network.ResNetBackbone
      layers: [3, 4, 6, 3]
      block: Bottleneck
    metadata_encoder:
      _target_: projects.hypernet_two_stage.models.spatial_hypernet.metadata_encoder.MetadataEncoder
      categorical_cardinalities: ${data.attribute_spec.categorical_cardinalities}
      num_continuous: ${data.attribute_spec.continuous_dim}
      embedding_dim: 4
      hidden_dim: 128
      output_dim: 16

  loss_fn:
    _target_: projects.hypernet_two_stage.loss.TaskLoss
    # weighting=inverse のとき workflow が親 config の class_weight を解決する。
    class_weight: ${class_weight}

  use_attributes: true
  backbone_checkpoint_path: null
  # 共有 backbone と classifier の凍結はこの project の既定の実験条件。凍結しない条件を試すときは
  # `stage2.model.freeze_backbone=false` で明示的に外す。
  freeze_backbone: true
  attribute_names: ${data.attribute_names}
  fairness_attribute_names: ${data.fairness_attribute_names}
  compile: false

# 共有 trainer への差分。null はこの stage では共有 trainer の値をそのまま使うという意味で、
# stage ごとに振りたい key だけをここに宣言する（例: `stage2.trainer.max_epochs=10`）。
trainer:
  max_epochs: null
