# @package hydra.job_logging
# run ごとの実行ログは run_logging が runs/<run-id>/logs/train.log に書く。
# Hydra 既定の file handler は repository root へ共有の log を作るため、console だけ残す。
version: 1
formatters:
  colorlog:
    "()": colorlog.ColoredFormatter
    format: "[%(cyan)s%(asctime)s%(reset)s][%(blue)s%(name)s%(reset)s][%(log_color)s%(levelname)s%(reset)s] - %(message)s"
    log_colors:
      DEBUG: purple
      INFO: green
      WARNING: yellow
      ERROR: red
      CRITICAL: red
handlers:
  console:
    class: logging.StreamHandler
    formatter: colorlog
    stream: ext://sys.stdout
root:
  level: INFO
  handlers: [console]
disable_existing_loggers: false
