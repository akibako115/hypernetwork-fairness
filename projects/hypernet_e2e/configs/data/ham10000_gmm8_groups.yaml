defaults:
  - ham10000
  - _self_

_target_: projects.hypernet_e2e.data.group_datamodule.GroupImageDataModule

# 学習前に固定した DINOv2 の GMM 8 クラスタ（ラベル不使用、LHCF の隠れコホートと同じ作り方）を group にする。
# 列は analysis/latent_bias_hypernet/latent_conditions.py が data/ham10000/splits_latent に足したもの。
cv_splits_dir: ${paths.data_dir}/ham10000/splits_latent
group_attribute_names: [gmm8]
group_cardinalities: [8]
num_groups: 8
group_key: group_id
