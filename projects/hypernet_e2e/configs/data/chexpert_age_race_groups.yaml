defaults:
  - chexpert
  - _self_

_target_: projects.hypernet_e2e.data.group_datamodule.GroupImageDataModule

# age_group_65 × race の intersectional group。race の欠損は第7カテゴリへ明示的に分ける。
# age_group_65 は fairness_age_groups が raw age から生成し、race は split の categorical 属性を使う。
group_attribute_names: [age_group_65, race]
group_cardinalities: [2, 7]
# race の欠損を既存カテゴリへ混ぜず、値6の独立groupとして扱う。
group_missing_values:
  race: 6
# Hydra は乗算できないため明示し、DataModule 側で積と突き合わせる。
num_groups: 14
group_key: group_id
