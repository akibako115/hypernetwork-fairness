# @package _global_
# ResNet baseline と iterative の 2×2 に合わせて class weight を inverse で固定する。変調範囲
# だけを変えた比較にしたいので、weighting は preset 側で決めて CLI では振らない。
defaults:
  - spatial_lora_chexpert_inverse_weighted_loss
  - _self_

experiment_name: spatial-lora-chexpert-fc
tags: [chexpert, spatial_lora_resnet50, erm, inverse_class_weight, modulation_fc]
model:
  net:
    # 分類ヘッドだけを condition で変調する。stage3/4 の Bottleneck は素の ResNet のまま残る。
    modulation_stages: [fc]
