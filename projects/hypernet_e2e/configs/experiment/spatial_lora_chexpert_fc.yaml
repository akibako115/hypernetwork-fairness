# @package _global_
# 変調範囲だけを変えた比較にする preset。class weight は CheXpert 系列の既定（inverse）を
# そのまま受け、ここでは触らない。
defaults:
  - spatial_lora_chexpert
  - _self_

experiment_name: spatial-lora-chexpert-fc
model:
  net:
    # 分類ヘッドだけを condition で変調する。stage3/4 の Bottleneck は素の ResNet のまま残る。
    modulation_stages: [fc]
