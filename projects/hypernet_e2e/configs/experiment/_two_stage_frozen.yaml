# @package _global_
# 2 段学習の 2 段目。同じ seed の 1 段目 ResNet ERM（best val AUROC）を起動時に
# model.backbone_checkpoint_path へ渡し、backbone と元の分類層を凍結して hypernetwork だけを学習する。
# model 既定の ImageNet 重みをここで打ち消す。打ち消さないと、親を渡し忘れた run が
# 「凍結した ImageNet backbone」で完走してしまう。
tags: [two_stage]
model:
  backbone_checkpoint_path: null
  freeze_backbone: true
