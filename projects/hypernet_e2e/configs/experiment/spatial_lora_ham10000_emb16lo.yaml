# @package _global_
# Spatial LoRA を、ラベル予測方向を INLP で除いた DINOv2 埋め込みの PCA 16 成分だけで条件付ける（段階 2）。
# 列は analysis/latent_bias_hypernet/latent_conditions.py が data/ham10000/splits_latent に足したもの。
# 学習前に固定した画像埋め込みを、属性の代わりに連続入力として MetadataEncoder に入れる（サンプルごとの連続な振り分け）。
defaults:
  - /model: spatial_lora_resnet50
  - _base_ham10000
  - _self_

experiment_name: spatial-lora-ham10000-emb16lo
tags: [latent_routing]

data:
  cv_splits_dir: ${paths.data_dir}/ham10000/splits_latent
  attribute_names:
    categorical: []
    continuous: [elo0, elo1, elo2, elo3, elo4, elo5, elo6, elo7, elo8, elo9, elo10, elo11, elo12, elo13, elo14, elo15]
  attribute_spec:
    categorical_cardinalities: []
    continuous_dim: 16
