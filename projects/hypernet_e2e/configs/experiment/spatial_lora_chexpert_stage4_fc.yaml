# @package _global_
# 変調範囲だけを変えた比較にする preset。class weight は CheXpert 系列の既定（inverse）を
# そのまま受け、ここでは触らない。
defaults:
  - spatial_lora_chexpert
  - _self_

experiment_name: spatial-lora-chexpert-stage4-fc
model:
  net:
    # 最終 stage と分類ヘッドを変調する。stage3 を外して変調範囲を 1 段浅くした条件。
    modulation_stages: [stage4, fc]
