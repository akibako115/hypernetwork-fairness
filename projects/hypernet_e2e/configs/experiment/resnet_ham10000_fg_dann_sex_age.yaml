# @package _global_
# 公平性手法の比較（ResNet-50、HAM10000）。性別と年齢を backbone の表現から敵対的に除く（DANN の勾配反転）。
defaults:
  - /model: resnet50_attribute_invariant_dann
  - _base_ham10000
  - _fairness_ham10000
  - _self_

experiment_name: resnet-ham10000-fg-dann-sex-age
attribute_invariance:
  enabled: true
model:
  loss_fn:
    adversarial_attribute_names:
      categorical: [sex]
      continuous: [age]
