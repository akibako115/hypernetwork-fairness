# @package _global_
defaults:
  - /data: isic2019
  # model group より後に置く。group 系の目的関数が model config の loss_fn を上書きする。
  - /training_strategy: erm
  - _self_

dataset: isic2019
# ISIC 2019 は CheXpert とは別系列で、まだ class weight を掛けない条件で揃えている。
# CheXpert 側の既定（inverse）に合わせているのではなく、意図してここだけ none にしている。
weighting: none

trainer:
  max_epochs: 30

data:
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
