# @package _global_
defaults:
  - /data: chexpert
  # model group より後に置く。group 系の目的関数が model config の loss_fn を上書きする。
  - /training_strategy: erm
  - _self_

dataset: chexpert
# CheXpert 系列は class weight を train split の逆頻度で統一している。統一値を preset 名で
# 表すと preset の選び忘れがそのまま別条件の run になるため、既定として置く。逸脱する条件
# （sampling だけで補正する ablation など）の側が weighting を明記する。
weighting: inverse

trainer:
  max_epochs: 30

data:
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
