# @package _global_
defaults:
  - callbacks: default
  - logger: wandb
  - paths: default
  - trainer: gpu
  # 既定の experiment は置かない。置くと、experiment を渡し忘れた起動が「たまたま既定だった
  # 条件」で完走してしまう。未指定は Hydra が MissingMandatoryValue で止める。
  - experiment: ???
  - override hydra/hydra_logging: colorlog
  - override hydra/job_logging: console
  - _self_

project: hypernet_e2e
# この run がどの仮説のためのものか。値は `analysis/<study>/` の directory 名で、W&B の group にも
# そのまま入る。既定は置かない。どの分析にも紐づかない run を残さないため、起動時に必ず指定する。
study: ???
task_name: train
seed: 12345
# tags は人が付ける印にだけ使う。dataset・model・目的関数のような、解決済み設定と run 名から
# 読める条件を写さない（CLI override で古くなり、W&B 上で嘘になる）。必要なときに
# `tags=[...]` で渡す。
tags: []

# true にすると fit も run directory 作成も行わず、起動条件の表だけを出す。
dry_run: false

# run.py が一意な run directory を予約してから設定する。config 単体では出力しない。
run_dir: null

# Hydra 固有の outputs/ は使わず、run.py が予約する project 内 runs/ だけへ保存する。
hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
