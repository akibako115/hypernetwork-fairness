_target_: projects.hypernet_e2e.module.LitModule

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1e-4
  weight_decay: 1e-2
scheduler: null

net:
  _target_: projects.hypernet_e2e.models.resnet.network.ResNet
  layers: [3, 4, 6, 3]
  block: Bottleneck
  num_classes: ${data.num_classes}
  zero_init_residual: false
  groups: 1
  width_per_group: 64
  replace_stride_with_dilation: null

loss_fn:
  _target_: projects.hypernet_e2e.loss.TaskLoss
  class_weight: null

use_attributes: false
# CheXpert の実験系列は ResNet-50 の ImageNet 重みから始める。これを外すとランダム初期化に
# なる。backbone を別 run から引き継ぐ preset は、この既定を null で打ち消すこと。
backbone_checkpoint_path: ${paths.checkpoints_dir}/resnet50_imagenet.pth
freeze_backbone: false
attribute_names: ${data.attribute_names}
fairness_attribute_names: ${data.fairness_attribute_names}
compile: false
