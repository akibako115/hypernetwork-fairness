# @package _global_
training_strategy:
  name: minimax_auc
  uses_group_id: true
  class_weight_scope: global
model:
  loss_fn:
    _target_: projects.hypernet_e2e.objectives.minimax_auc.MinimaxAUCTaskLoss
    num_groups: ${data.num_groups}
    group_key: ${data.group_key}
    population_cell_counts: null
    dual_step_size: 0.01
    pair_scope: all
