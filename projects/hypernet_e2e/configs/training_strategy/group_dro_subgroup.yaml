# @package _global_
training_strategy:
  name: group_dro_subgroup
  uses_group_id: true
  class_weight_scope: subgroup
model:
  loss_fn:
    _target_: projects.hypernet_e2e.loss.SubgroupClassWeightedGroupDROTaskLoss
    num_groups: ${data.num_groups}
    class_weight: null
    step_size: 0.01
    group_key: ${data.group_key}
callbacks:
  model_checkpoint:
    # 原論文（Sagawa et al. 2020）は val の最悪群の成績が最良の epoch を選ぶ。分析側で選べるよう全 epoch の重みを残す
    # （docs/methods/group-dro.md）。
    save_top_k: -1
    save_weights_only: true
