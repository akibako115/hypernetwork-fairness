[project]
name = "hypernet-fairness"
version = "0.1.0"
description = "Hypernetwork approaches to fairness in medical imaging"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "hydra-colorlog==1.2.0",
    "hydra-core==1.3.2",
    "lightning>=2.6.0",
    "matplotlib>=3.10.8",
    "numpy>=2.2.6",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "rich>=14.2.0",
    "rootutils>=1.0.7",
    "ruff>=0.14.10",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "torch>=2.7.1",
    "torchmetrics>=1.8.2",
    "torchvision>=0.22.1",
    "ty>=0.0.10",
    "wandb>=0.23.1",
    "ipykernel>=6.29.0",
    "jupyterlab>=4.0.0",
    "tqdm>=4.67.1",
    "einops>=0.8.2",
    "pandas>=2.3.3",
    "pillow>=12.1.0",
    "pyarrow>=22.0.0",
    "python-dateutil>=2.9.0.post0",
    "openpyxl>=3.1.5",
    "redivis>=0.20.10",
    "fsspec>=2025.12.0",
    "datasets>=5.0.0",
    "marimo>=0.23.11",
    "hdbscan>=0.8.44",
    "transformers>=5.17.0",
]

[project.optional-dependencies]
analysis = [
    "umap-learn>=0.5.9",
]

[tool.pytest.ini_options]
# キャッシュは作業ツリーを汚さないよう ~/.cache 配下へ逃がす（PYTHONPYCACHEPREFIX と同方針）。
cache_dir = "$HOME/.cache/pytest/hypernet-fairness"
addopts = [
  "--color=yes",
  "--durations=0",
  "--strict-markers",
  "--doctest-modules",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]
log_cli = "True"
markers = [
  "slow: slow tests",
  "preflight: 学習起動前に走らせる golden 照合テスト",
]
minversion = "6.0"
testpaths = ["tests", "projects", "analysis"]
# run artifact（`projects/*/runs/`）と分析の生成物は test 対象ではないので走査しない。
# 走査すると wandb が container 内で作った log の symlink を辿って PermissionError になり、
# collection ごと落ちる。既定値を上書きするので、pytest の既定分もここに残す。
norecursedirs = [
  "*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}",
  "runs", "wandb", "outputs", "cache", "results", "figures",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: nocover",
    "raise NotImplementedError",
    "raise NotImplementedError()",
    'if __name__ == "__main__":',
]

[tool.ruff]
# キャッシュは作業ツリーを汚さないよう ~/.cache 配下へ逃がす（pytest と同方針）。
cache-dir = "~/.cache/ruff/hypernet-fairness"
line-length = 200
target-version = "py310"
lint.select = ["E", "F", "I", "B", "UP"]
exclude = ["logs_chexpert", "data", ".venv"]

[tool.ruff.lint.isort]
known-first-party = ["projects", "analysis", "data_pipeline", "tests"]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "ruff>=0.14.10",
]
